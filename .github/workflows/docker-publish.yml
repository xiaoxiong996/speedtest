name: 构建并推送镜像（多架构 / 主控 + 节点）

# 触发：推 tag（v1.4.4）、推 main（构建 latest）、或手动触发。
# 一次运行会产出两个仓库：
#   ghcr.io/<owner>/<repo>       ← 主控版（APP_MODE=controller）
#   ghcr.io/<owner>/<repo>-node  ← 节点版（APP_MODE=node）
# 两者二进制完全相同，只是镜像名区分开，便于 compose 里直接写死各自的地址。
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 自动等于 "owner/repo"，无需手改
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 依赖与标准库漏洞扫描：每次推代码都查一遍，不用再靠人工隔几个月扫一次
  scan:
    name: 漏洞扫描（govulncheck）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: 运行 govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # 给非 Docker / 非 root 部署用：产出两个静态二进制，挂到 Release 附件上
  binary:
    name: 构建二进制（${{ matrix.arch }}）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - name: 编译（静态链接，不依赖 glibc/musl）
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          OUT="speedtest-linux-${{ matrix.arch }}"
          go build -trimpath -ldflags "-s -w" -o "$OUT" .
          chmod +x "$OUT"
          ls -lh "$OUT"
          # arm64 二进制在 x86 runner 上跑不了，只对 amd64 做冒烟验证
          if [ "${{ matrix.arch }}" = "amd64" ]; then ./"$OUT" --version; fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: speedtest-linux-${{ matrix.arch }}
          path: speedtest-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推 ghcr.io 需要写权限
    strategy:
      fail-fast: false
      matrix:
        variant:
          - main
          - node

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # arm64 镜像靠 QEMU 交叉编译；Dockerfile 里已按 TARGETARCH 选择 GOARCH
      - name: 设置 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像名
        id: img
        run: |
          if [ "${{ matrix.variant }}" = "node" ]; then
            echo "name=${REGISTRY}/${IMAGE_NAME}-node" >> "$GITHUB_OUTPUT"
          else
            echo "name=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # 构建成功后自动创建 Release（仅推 tag 时），附上镜像地址与一键安装命令
  release:
    needs: [build-and-push, binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 取回二进制
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/speedtest-linux-*
          body: |
            ## 镜像

            | 用途 | 镜像 |
            |---|---|
            | 主控（网页 + 后台 + 报告） | `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` |
            | 测速节点 | `ghcr.io/${{ github.repository }}-node:${{ github.ref_name }}` |

            支持 `linux/amd64` 与 `linux/arm64`（ARM 小鸡可直接拉）。

            ## 一键安装

            ```bash
            # 主控
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/deploy/install.sh \
              | sudo bash -s -- --image ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            # 节点
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/deploy/install-node.sh \
              | sudo bash -s -- --image ghcr.io/${{ github.repository }}-node:${{ github.ref_name }} --domain node.example.com
            ```

            卸载脚本分别在 `deploy/uninstall.sh`（主控）与 `deploy/uninstall-node.sh`（节点）。

            ## 不用 Docker / 不用 root

            附件的 `speedtest-linux-amd64` / `speedtest-linux-arm64` 是静态编译的单文件二进制，
            网页与控制台已内嵌，拷过去就能跑。脚本会装成 systemd **用户**服务（`systemctl --user`），
            全程不需要 root，端口用 ≥1024 的即可：

            ```bash
            # 主控（默认监听 127.0.0.1:3333，前面自己接 HTTPS 反代）
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/deploy/install-local.sh \
              | bash -s -- --mode controller --port 3333

            # 测速节点（监听 8443，自动签发证书）
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/deploy/install-local.sh \
              | bash -s -- --mode node --domain node1.example.com --origin https://speed.example.com
            ```

            卸载：`bash deploy/uninstall-local.sh --mode controller|node`（加 `--purge` 连数据一起删）。
