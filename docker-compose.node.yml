# ===== 纯测速节点版（无 web、无后台、不落盘）=====
# 一键部署：docker compose -f docker-compose.node.yml up -d --build
# 从 GitHub 拉镜像：IMAGE=ghcr.io/你的用户名/仓库名:1.2.36 docker compose -f docker-compose.node.yml up -d
#
# 安全设计：
#  - APP_MODE=node：进程里只注册测速端点，没有任何后台/报告/静态页面路由
#  - 不挂载 data 卷、不写 config.json / results.jsonl，容器只读也能跑
#  - 配置只在启动时从下面环境变量读入一次，运行期无法被外部请求修改
#  - 根文件系统只读 + 丢弃所有 Linux capabilities + 禁止提权
services:
  speedtest-node:
    image: "${IMAGE:-speedtest-node:1.2.48}"
    build:
      context: .
    container_name: speedtest-node
    restart: unless-stopped
    network_mode: host          # 节点直接对外暴露测速端口，拿到访客真实 IP
    read_only: true             # 根文件系统只读，杜绝写入/注入
    cap_drop:
      - ALL                     # 丢弃全部 capabilities
    security_opt:
      - no-new-privileges:true  # 禁止进程提权
    pids_limit: 256
    environment:
      APP_MODE: "node"
      HTTP_HOST: "${HTTP_HOST:-0.0.0.0}"      # 节点需对外，监听所有网卡
      HTTP_PORT: "${NODE_PORT:-8443}"          # 注意避开主控的 3333
      TZ: Asia/Shanghai

      # ------- 三道访问白名单（全部来自 Compose，启动后不可改）-------
      # 允许访问测速的访客 IP 段，逗号分隔；留空=不限制。支持单 IP / CIDR，v4 v6 均可。
      # 例：1.2.3.0/24,2001:db8::/32
      NODE_ALLOW_CIDRS: "${NODE_ALLOW_CIDRS:-}"
      # 允许访问的域名（Host 头，小写，支持 *.example.com 通配）；留空=不限制。
      NODE_ALLOW_HOSTS: "${NODE_ALLOW_HOSTS:-}"
      # 允许跨源调用的 Origin（主控站域名，带 https://）；留空=任意 Origin。
      # 例：https://speed.example.com
      NODE_ALLOW_ORIGINS: "${NODE_ALLOW_ORIGINS:-}"
      # 测速端点 base 路径，加在 /api 之前；留空=/api/ping；填 /s3cr3t 则端点为 /s3cr3t/api/ping。
      # 主控后台「节点地址」要填成 https://域名:端口 + 该前缀。
      NODE_PATH_PREFIX: "${NODE_PATH_PREFIX:-}"

      # 真实 IP：节点直连时留空即可（RemoteAddr 即真实访客）；若节点也套了 CDN/反代，照主控那样配
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      TRUSTED_IP_HEADERS: "${TRUSTED_IP_HEADERS:-X-Real-IP}"
      LOG_CLIENT_IP: "${LOG_CLIENT_IP:-0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${NODE_PORT:-8443}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 4s
      start_period: 5s
      retries: 3
