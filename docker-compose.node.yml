# ============================================================================
#  测速节点版 —— 只走 Let's Encrypt 证书，只开一个端口
# ----------------------------------------------------------------------------
#  用法：
#    1) 改下面 NODE_ACME_DOMAINS 为你的域名（必须已解析到本机公网 IP，DNS 灰云直连）
#    2) docker compose -f docker-compose.node.yml up -d
#    3) 把 https://<域名>:8445 填进主控后台的「节点地址」
#
#  证书：Let's Encrypt（访客零配置，不用装任何根证书）。两种来源：
#        · 有公网 443  → NODE_TLS_MODE=acme，全自动签发 + 续期
#        · 只有高端口（NAT）→ NODE_TLS_MODE=file，用 deploy/issue-cert.sh 走 DNS 手动验证
#  端口：host 网络下节点只监听 NODE_PORT 一个端口，没有页面、没有后台、没有第二个端口。
# ============================================================================
services:
  speedtest-node:
    image: "${IMAGE:-speedtest-node:1.4.1}"
    container_name: speedtest-node
    restart: unless-stopped

    # host 网络：容器直接用宿主机网卡，主控才能看到访客真实 IP。
    # 端口不在这里映射，只由下面的 NODE_PORT 决定。
    network_mode: host

    # 加固：只读根文件系统 + 丢弃全部 capability。
    # 面板签发证书要写 acme.sh 目录，所以额外挂一个可写卷给它。
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=16m          # 只读根目录下需要临时目录
      - /data:size=1m          # 兜住镜像声明的 VOLUME，保证节点不落盘

    environment:
      APP_MODE: "node"                  # 节点模式：只注册测速端点，没有页面/后台

      # ★ 主控连接端口：节点只监听这一个，主控后台填 https://<域名>:<这个端口>
      HTTP_PORT: "${NODE_PORT:-8445}"
      HTTP_HOST: "0.0.0.0"              # host 网络下必须 0.0.0.0 才对公网可用

      # ---- 证书：二选一 ----
      # acme（默认）：内置自动签发，需要公网 443 能打到本机
      # file       ：读下面指定的证书文件。NAT 机器（没有 80/443）用这个，
      #              证书由 deploy/issue-cert.sh 走 DNS 手动验证签发
      NODE_TLS_MODE: "${NODE_TLS_MODE:-acme}"
      NODE_TLS_CERT: "${NODE_TLS_CERT:-/certs/cert.pem}"
      NODE_TLS_KEY: "${NODE_TLS_KEY:-/certs/key.pem}"

      # acme 模式需要：证书域名，逗号分隔，第一个为主域名（须解析到本机公网 IP）
      NODE_ACME_DOMAINS: "${NODE_ACME_DOMAINS:-}"
      NODE_ACME_EMAIL: "${NODE_ACME_EMAIL:-}"            # 到期提醒邮箱（可选）
      NODE_ACME_DIR: "${NODE_ACME_DIR:-/certs/acme}"     # 证书缓存，删了会重新申请
      NODE_ACME_STAGING: "${NODE_ACME_STAGING:-0}"       # 1=测试环境（调试用，证书不被信任）

      # ★ 只允许你的主控站调用（留空=任何网站都能用你的带宽）
      NODE_ALLOW_ORIGINS: "${NODE_ALLOW_ORIGINS:-}"
      # 可选再收紧：允许的 Host、允许测速的访客 IP 段
      NODE_ALLOW_HOSTS: "${NODE_ALLOW_HOSTS:-}"
      NODE_ALLOW_CIDRS: "${NODE_ALLOW_CIDRS:-}"
      # DDNS：把域名自动指向本机当前公网 IP（动态 IP 必备）。
      # 格式 "域名:A,域名2:AAAA"，用面板里的同一个 Cloudflare Token 更新记录。
      # 也可在面板里加减，面板的改动只在内存生效（重启回到这里的值）。
      NODE_DDNS: "${NODE_DDNS:-}"
      NODE_DDNS_INTERVAL: "${NODE_DDNS_INTERVAL:-5}"   # 检查间隔（分钟）
      # 路径前缀：留空 = /api/ping；填 /n1 = /n1/api/ping（主控地址要带上它）
      NODE_PATH_PREFIX: "${NODE_PATH_PREFIX:-}"

      # ★ 节点自己的面板（隐藏路径 + 账号密码）。留空路径或账号密码 = 不启用面板。
      # 面板与测速端点共用同一个端口，不用额外开端口。
      NODE_PANEL_PATH: "${NODE_PANEL_PATH:-}"
      NODE_PANEL_USER: "${NODE_PANEL_USER:-}"
      NODE_PANEL_PASS: "${NODE_PANEL_PASS:-}"
      # 证书目录 & acme.sh 安装目录（面板签发证书用）
      NODE_CERT_DIR: "${NODE_CERT_DIR:-/certs}"
      # 证书到期前多少天自动续期
      NODE_CERT_RENEW_DAYS: "${NODE_CERT_RENEW_DAYS:-30}"
      # Cloudflare API Token：填了就是全自动（自动加 TXT、自动续期）
      # 留空则手动模式（面板显示 TXT，你去 DNS 后台加）
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN:-}"
      # 首次部署还没有证书时，额外开一个纯 HTTP 端口给面板用（默认 HTTPS 端口+1），
      # 签好证书或超时后自动关闭。设 0 = 完全不开。
      NODE_HTTP_BOOTSTRAP_MINUTES: "${NODE_HTTP_BOOTSTRAP_MINUTES:-10}"
      NODE_HTTP_PORT: "${NODE_HTTP_PORT:-}"

      TZ: "${TZ:-Asia/Shanghai}"

    volumes:
      - ./certs:/certs:rw         # 证书：签好后放这里，备份它=备份证书
      - ./acme:/certs/acme:rw     # ACME 账户密钥（续期靠它，别删）

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    healthcheck:
      # 首次握手才签证书，容器内没有域名 SNI 会握手失败，所以只探端口连通性
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${NODE_PORT:-8445} || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
